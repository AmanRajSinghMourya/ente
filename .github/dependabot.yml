version: 2

updates:
  - package-ecosystem: "npm"
    directories:
      - "/web"
      - "/web/apps/*"
      - "/web/packages/*"
      - "/web/packages/wasm/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      web:
        applies-to: "version-updates"
        patterns:
          - "*"
      web-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/infra/workers"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        applies-to: "version-updates"
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      rust:
        applies-to: "version-updates"
        patterns:
          - "*"
