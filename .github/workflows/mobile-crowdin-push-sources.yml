name: "Push sources to Crowdin (Mobile)"

on:
    push:
        branches: [main]
        paths:
            - ".github/workflows/mobile-crowdin-push-sources.yml"
            - "mobile/packages/strings/lib/l10n/arb/strings_en.arb"
            - "mobile/packages/strings/crowdin.yml"
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    push-sources-to-crowdin:
        name: "Push mobile string sources"
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Crowdin push
              uses: crowdin/github-action@52aa776766211d83d975df51f3b9c53c2f8ba35f # v2.16.3
              with:
                  base_path: mobile/packages/strings/
                  config: mobile/packages/strings/crowdin.yml
                  upload_sources: true
                  upload_translations: false
                  download_translations: false
                  project_id: 574741
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
