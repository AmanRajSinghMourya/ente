name: "Sync Crowdin (Mobile)"

on:
    schedule:
        # Run Mondays at ~6:20 AM IST
        # See: [Note: Run workflow on specific days of the week]
        - cron: "50 0 * * 1"
    # Also allow manually running the workflow.
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    synchronize-with-crowdin:
        name: "Sync mobile strings with Crowdin"
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Crowdin's action
              uses: crowdin/github-action@52aa776766211d83d975df51f3b9c53c2f8ba35f # v2.16.3
              with:
                  base_path: mobile/packages/strings/
                  config: mobile/packages/strings/crowdin.yml
                  upload_sources: true
                  upload_translations: false
                  download_translations: true
                  localization_branch_name: translations/mobile
                  create_pull_request: true
                  skip_untranslated_strings: true
                  pull_request_title: "[mobile] New translations"
                  pull_request_body: "New translations from [Crowdin](https://crowdin.com/project/ente-photos-app)"
                  pull_request_base_branch_name: "main"
                  project_id: 574741
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
