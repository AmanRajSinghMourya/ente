name: "Lint (Staff)"

on:
    workflow_call:

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: infra/staff

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup node and enable npm caching
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: "npm"
                  cache-dependency-path: "infra/staff/package-lock.json"

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint
