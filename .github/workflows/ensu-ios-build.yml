name: "Build (Ensu iOS)"

on:
    workflow_call:

permissions:
    contents: read

jobs:
    build-and-test:
        runs-on: macos-latest

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # Restore-only; primed on main by warm-caches.yml.
            - name: Restore Rust cache
              uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
              with:
                  workspaces: rust
                  shared-key: ensu-ios
                  cache-targets: false
                  save-if: false

            - name: Restore Rust target
              uses: ./.github/actions/restore-rust-target
              with:
                  shared-key: ensu-ios

            - run: cargo codegen native
              working-directory: rust

            # PRs lack inference fixtures, so this only tests build and startup.
            - name: Build and test Ensu
              working-directory: apple/apps/ensu
              run: xcodebuild test -scheme Ensu -destination 'platform=iOS Simulator,name=iPhone 17'
