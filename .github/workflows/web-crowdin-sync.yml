name: "Sync Crowdin (Web)"

on:
    push:
        branches: [main]
        paths:
            - ".github/workflows/web-crowdin-sync.yml"
            - "web/crowdin.yml"
            - "web/packages/base/locales/en-US/translation.json"
    schedule:
        # Mondays at ~6:00 AM IST
        - cron: "20 0 * * 1"
    workflow_dispatch:

# Crowdin needs both permissions to commit translations and open its PR.
permissions:
    contents: write
    pull-requests: write

jobs:
    synchronize-with-crowdin:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Crowdin's action
              uses: crowdin/github-action@52aa776766211d83d975df51f3b9c53c2f8ba35f # v2.16.3
              with:
                  base_path: "web/"
                  config: "web/crowdin.yml"
                  upload_sources: true
                  upload_translations: false
                  download_translations: true
                  localization_branch_name: translations/web
                  create_pull_request: true
                  skip_untranslated_strings: true
                  pull_request_title: "[web] New translations"
                  pull_request_body: "New translations from [Crowdin](https://crowdin.com/project/ente-photos-web)"
                  pull_request_base_branch_name: "main"
                  project_id: 569613
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
